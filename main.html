<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Will You Be My Valentine? 💖</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      overflow: hidden;
    }

    /* Floating hearts */
    .heart {
      position: fixed;
      bottom: -20px;
      color: rgba(255, 77, 109, 0.7);
      font-size: 20px;
      animation: floatUp linear forwards;
      pointer-events: none;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      to {
        transform: translateY(-120vh) scale(1.6);
        opacity: 0;
      }
    }

    .card {
      background: white;
      padding: 30px 25px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      max-width: 320px;
      width: 90%;
      position: relative;
      z-index: 2;
    }

    h1 {
      color: #ff4d6d;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      font-size: 16px;
      margin-bottom: 25px;
    }

    .buttons {
      position: relative;
      height: 80px;
    }

    button {
      padding: 12px 22px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    #yes {
      background: #ff4d6d;
      color: white;
      font-weight: bold;
    }

    #yes:hover {
      transform: scale(1.1);
    }

    #no {
      background: #eee;
      color: #999;
      position: absolute;
      right: 10px;
      bottom: 0;
      font-size: 14px;
    }

    .message {
      display: none;
      margin-top: 20px;
      font-size: 18px;
      color: #ff4d6d;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Hey Laddoooooooo 💕</h1>
    <p>
      From random talks to endless smiles,<br>
      you make everything better.<br><br>
      Will you be my Forever Valentine? 🌹
    </p>

    <div class="buttons">
      <button id="yes">Yes 💖</button>
      <button id="no">No 🙈</button>
    </div>

    <div class="message" id="loveMessage">
      YAYYY 💕💖💘<br>
      You just made my heart explode 🥰
    </div>
  </div>

  <script>
  const noBtn = document.getElementById("no");
  const yesBtn = document.getElementById("yes");

  // Initial position
  let posX = window.innerWidth / 2;
  let posY = window.innerHeight / 2;

  noBtn.style.position = "fixed";

  // Gentle roaming
  setInterval(() => {
    posX += Math.random() * 20 - 10;
    posY += Math.random() * 20 - 10;
    clampPosition();
    updateButton();
  }, 400);

  // Mouse repulsion
  document.addEventListener("mousemove", (e) => {
    const rect = noBtn.getBoundingClientRect();
    const bx = rect.left + rect.width / 2;
    const by = rect.top + rect.height / 2;

    const dx = bx - e.clientX;
    const dy = by - e.clientY;

    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < 140) {
      const force = 60; // escape speed
      posX += (dx / dist) * force;
      posY += (dy / dist) * force;
      clampPosition();
      updateButton();
    }
  });

  function clampPosition() {
    posX = Math.max(10, Math.min(window.innerWidth - noBtn.offsetWidth - 10, posX));
    posY = Math.max(10, Math.min(window.innerHeight - noBtn.offsetHeight - 10, posY));
  }

  function updateButton() {
    noBtn.style.left = posX + "px";
    noBtn.style.top = posY + "px";
  }

  // Heart stuff unchanged
  function createHeart(speed = false) {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerText = "💖";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 22 + 16 + "px";
    heart.style.animationDuration = speed
      ? Math.random() * 1.5 + 2 + "s"
      : Math.random() * 3 + 4 + "s";

    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 7000);
  }

  setInterval(() => createHeart(false), 350);

  yesBtn.addEventListener("click", () => {
    document.getElementById("loveMessage").style.display = "block";
    for (let i = 0; i < 40; i++) {
      setTimeout(() => createHeart(true), i * 50);
    }
  });
</script>


</body>
</html>
